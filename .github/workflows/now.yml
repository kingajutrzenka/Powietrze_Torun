name: Aktualizacja jakości powietrza

on:
  schedule:
    - cron: "20 * * * *"   # co godzinę o :20 (UTC) – GIOŚ liczy indeks ok. kwadrans po pełnej godzinie
  workflow_dispatch:        # ręczne uruchomienie z zakładki Actions
    inputs:
      backfill:
        description: "Pobierz archiwum z ostatnich 35 dni (raz, trwa ok. 10 min)"
        type: boolean
        default: false
  push:
    branches: [main]        # po każdej Twojej zmianie (np. w index.html) strona też się odświeża

permissions:
  contents: write   # zapis data/now.json do repo
  pages: write      # wdrożenie strony
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalacja zależności
        run: pip install requests pandas

      - name: Pobranie indeksu
        # gdy GIOŚ nie odpowie, strona i tak się wdroży z poprzednimi danymi
        continue-on-error: true
        run: python fetch_now.py

      - name: Pobranie historii (30 dni)
        continue-on-error: true
        run: python fetch_history.py ${{ inputs.backfill && '--backfill' || '' }}

      - name: Zapis zmian w repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --staged --quiet; then
            git commit -m "Aktualizacja danych"
            git pull --rebase
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
