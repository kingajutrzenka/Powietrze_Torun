name: Aktualizacja jakości powietrza

on:
  schedule:
    - cron: "20 * * * *"  
  workflow_dispatch:        

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalacja zależności
        run: pip install requests

      - name: Pobranie indeksu
        run: python fetch_now.py

      - name: Zapis zmian
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/now.json
          git diff --staged --quiet || git commit -m "Aktualizacja now.json"
          git push
